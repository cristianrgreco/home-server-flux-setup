apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: openclaw
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - openclaw
  rules:
    - host: openclaw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw
                port:
                  number: 18789
