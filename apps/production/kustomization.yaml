apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/minecraft
  - ../base/openclaw
  - ../base/pihole
patches:
  - path: minecraft-values.yaml
    target:
      kind: HelmRelease
      name: minecraft
      namespace: minecraft
  - path: pihole-values.yaml
    target:
      kind: HelmRelease
