---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 24h
  url: https://pkgs.tailscale.com/helmcharts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 12h
  install:
    remediation:
      retries: 3
  values:
    installCRDs: true
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"
    proxyConfig:
      defaultTags: "tag:k8s-operator"
